name: Android UI CI

on:
  push:
    branches:
      - feature/VA-030-responsive-tablet-layouts
      - feature/VA-031-accessibility
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Kotlin, instrumentation compilation, unit tests and APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile, test and assemble
        run: |
          gradle :app:compileDebugKotlin :app:compileReleaseKotlin \
            :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest \
            :app:assembleDebug :app:assembleRelease \
            --no-daemon --max-workers=2 --console=plain

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
