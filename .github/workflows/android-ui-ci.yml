name: Android UI CI

on:
  push:
    branches:
      - feature/VA-030-responsive-tablet-layouts
      - feature/VA-033-magic-111-random-questions
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Kotlin Debug and unit-test validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and test Debug without a release signing key
        env:
          # A Linux absolute path overrides the tracked Windows keystore path.
          # No release artifact is signed or published by this workflow.
          VCC_RELEASE_STORE_FILE: /tmp/va033-ci-unconfigured-release.p12
        run: |
          gradle :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin \
            :app:testDebugUnitTest :app:assembleDebug \
            --no-daemon --max-workers=2 --console=plain

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
