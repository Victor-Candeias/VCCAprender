name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Versao da app (MAJOR.MINOR.PATCH)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release
        env:
          APP_VERSION: ${{ inputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2 --no-parallel -PappVersion="$APP_VERSION" -PbuildNumber="$BUILD_NUMBER"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VCCAprender-v${{ inputs.app_version }}-build${{ github.run_number }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
