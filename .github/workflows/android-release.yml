# Android Release: sign with GitHub Actions repository Secrets, never committed credentials.
# Required Secrets:
# VCC_RELEASE_KEYSTORE_BASE64, VCC_RELEASE_STORE_PASSWORD,
# VCC_RELEASE_KEY_ALIAS, VCC_RELEASE_KEY_PASSWORD
name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Versao da app (MAJOR.MINOR.PATCH)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate required GitHub Secrets
        shell: bash
        env:
          VCC_RELEASE_KEYSTORE_BASE64: ${{ secrets.VCC_RELEASE_KEYSTORE_BASE64 }}
          VCC_RELEASE_STORE_PASSWORD: ${{ secrets.VCC_RELEASE_STORE_PASSWORD }}
          VCC_RELEASE_KEY_ALIAS: ${{ secrets.VCC_RELEASE_KEY_ALIAS }}
          VCC_RELEASE_KEY_PASSWORD: ${{ secrets.VCC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in VCC_RELEASE_KEYSTORE_BASE64 VCC_RELEASE_STORE_PASSWORD VCC_RELEASE_KEY_ALIAS VCC_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::GitHub Secret em falta: $key"
              exit 1
            fi
          done

      - name: Prevent fallback to tracked local signing settings
        shell: bash
        run: |
          # Secrets are the only signing source inside this workflow.
          rm -f -- keystore.properties

      - name: Restore release keystore
        shell: bash
        env:
          VCC_RELEASE_KEYSTORE_BASE64: ${{ secrets.VCC_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["VCC_RELEASE_KEYSTORE_BASE64"]
          data = base64.b64decode("".join(encoded.split()), validate=True)
          if not data:
              raise SystemExit("A keystore fornecida esta vazia.")

          target = Path(os.environ["RUNNER_TEMP"]) / "VCCProjects.jks"
          target.write_bytes(data)
          target.chmod(0o600)
          PY

      - name: Build signed Release APK
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          VCC_RELEASE_STORE_FILE: ${{ runner.temp }}/VCCProjects.jks
          VCC_RELEASE_STORE_PASSWORD: ${{ secrets.VCC_RELEASE_STORE_PASSWORD }}
          VCC_RELEASE_KEY_ALIAS: ${{ secrets.VCC_RELEASE_KEY_ALIAS }}
          VCC_RELEASE_KEY_PASSWORD: ${{ secrets.VCC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease \
            --no-daemon --max-workers=2 --no-parallel --console=plain \
            -PappVersion="$APP_VERSION" -PbuildNumber="$BUILD_NUMBER"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [[ -z "$apk" ]]; then
            echo "::error::Nao foi gerado nenhum APK Release."
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner nao encontrado no Android SDK."
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VCCAprender-v${{ inputs.app_version }}-build${{ github.run_number }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/VCCProjects.jks"
