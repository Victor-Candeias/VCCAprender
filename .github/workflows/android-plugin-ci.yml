name: Android Plugin SDK CI

on:
  push:
    branches:
      - feature/VA-035-independent-game-plugins
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Remove any local signing material
        run: |
          rm -f keystore.properties
          test ! -f keystore.properties

      - name: Build host, SDK and independent sample APK
        env:
          # Debug never needs release secrets. Avoid Linux misreading a Windows path.
          VCC_RELEASE_STORE_FILE: /tmp/vcc-release-not-configured-in-ci.p12
        run: |
          gradle :game-plugin-sdk:testDebugUnitTest \
            :app:compileDebugKotlin :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin :app:assembleDebug \
            :sample-game-plugin:assembleDebug \
            --no-daemon --max-workers=2 --console=plain

      - name: Upload both independent APKs
        uses: actions/upload-artifact@v4
        with:
          name: vcc-plugin-sdk-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            sample-game-plugin/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
