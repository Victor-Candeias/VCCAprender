name: Android Game Plugin Release

on:
  workflow_dispatch:
    inputs:
      plugin_version:
        description: 'Versao do APK independente (MAJOR.MINOR.PATCH)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

jobs:
  sample-plugin-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing Secrets
        shell: bash
        env:
          VCC_RELEASE_KEYSTORE_BASE64: ${{ secrets.VCC_RELEASE_KEYSTORE_BASE64 }}
          VCC_RELEASE_STORE_PASSWORD: ${{ secrets.VCC_RELEASE_STORE_PASSWORD }}
          VCC_RELEASE_KEY_ALIAS: ${{ secrets.VCC_RELEASE_KEY_ALIAS }}
          VCC_RELEASE_KEY_PASSWORD: ${{ secrets.VCC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in VCC_RELEASE_KEYSTORE_BASE64 VCC_RELEASE_STORE_PASSWORD VCC_RELEASE_KEY_ALIAS VCC_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::GitHub Secret em falta: $key"
              exit 1
            fi
          done

      - name: Restore signed build keystore
        shell: bash
        env:
          VCC_RELEASE_KEYSTORE_BASE64: ${{ secrets.VCC_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          rm -f -- keystore.properties
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = base64.b64decode("".join(os.environ["VCC_RELEASE_KEYSTORE_BASE64"].split()), validate=True)
          if not data:
              raise SystemExit("Keystore vazia")
          target = Path(os.environ["RUNNER_TEMP"]) / "VCCProjects.jks"
          target.write_bytes(data)
          target.chmod(0o600)
          PY

      - name: Build independently signed sample plugin
        shell: bash
        env:
          PLUGIN_VERSION: ${{ inputs.plugin_version }}
          PLUGIN_BUILD: ${{ github.run_number }}
          VCC_RELEASE_STORE_FILE: ${{ runner.temp }}/VCCProjects.jks
          VCC_RELEASE_STORE_PASSWORD: ${{ secrets.VCC_RELEASE_STORE_PASSWORD }}
          VCC_RELEASE_KEY_ALIAS: ${{ secrets.VCC_RELEASE_KEY_ALIAS }}
          VCC_RELEASE_KEY_PASSWORD: ${{ secrets.VCC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :game-plugin-sdk:testDebugUnitTest :sample-game-plugin:assembleRelease \
            --no-daemon --max-workers=2 --no-parallel --console=plain \
            -PpluginVersion="$PLUGIN_VERSION" -PpluginBuildNumber="$PLUGIN_BUILD"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --verbose sample-game-plugin/build/outputs/apk/release/*.apk

      - name: Upload standalone plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: VCCSampleGame-v${{ inputs.plugin_version }}-build${{ github.run_number }}-release
          path: sample-game-plugin/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/VCCProjects.jks"
